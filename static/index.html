<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SiteSync Interface Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: timeline-first operations console. App bar with role switcher and notifications, left rail per role, timeline as the main canvas, popovers for step updates, request trackers for every hand-off, demo-script drawer. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#F6F7F4; --fg:#18202C; --muted:#5A6270; --faint:#8A919B; --line:#D7DAD3;
  --accent:#D9531E; --accent-soft:#FBE4D8; --steel:#2F5D8A; --steel-soft:#DCE6F0;
  --plan:#BFC3BC; --risk:#B7791F; --risk-soft:#F7EAD2; --good:#2E7D4F; --good-soft:#DCEFE2; --bad:#B42318; --bad-soft:#F9E0DC;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 4px 16px rgba(20,24,30,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151A; --surface:#1A1E25; --sunk:#161A20; --fg:#E6E8E4; --muted:#9BA2AC; --faint:#6F7680; --line:#2C323B;
  --accent:#FF7B42; --accent-soft:#3A2419; --steel:#86AEDB; --steel-soft:#1D2A38;
  --plan:#4B515A; --risk:#E3A64A; --risk-soft:#3A2F1A; --good:#6CC08E; --good-soft:#1B3325; --bad:#F2877A; --bad-soft:#3B1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151A; --surface:#1A1E25; --sunk:#161A20; --fg:#E6E8E4; --muted:#9BA2AC; --faint:#6F7680; --line:#2C323B;
  --accent:#FF7B42; --accent-soft:#3A2419; --steel:#86AEDB; --steel-soft:#1D2A38;
  --plan:#4B515A; --risk:#E3A64A; --risk-soft:#3A2F1A; --good:#6CC08E; --good-soft:#1B3325; --bad:#F2877A; --bad-soft:#3B1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 1.35rem/1 var(--f-display);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:10px;border-top:3px solid var(--accent);border-bottom:3px solid var(--steel)}
.today{font:500 .75rem var(--f-mono);color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:4px}
.roles{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.role{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:.82rem}
.role .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 .7rem var(--f-body);color:#fff}
.role small{color:var(--muted);font-size:.72rem}
.role[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.role .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 56px)}
.rail{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.rail .org{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 10px 10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;border:0;background:none;text-align:left;font-weight:500;color:var(--muted)}
.nav:hover{background:var(--surface);color:var(--fg)}
.nav[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.badge{font:600 .68rem/1 var(--f-mono);padding:3px 6px;border-radius:99px;background:var(--accent);color:#fff}
main{padding:22px 24px 120px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font:700 1.9rem/1 var(--f-display);margin:0}
.ph p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* cards and primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h3{font:600 1.15rem/1.2 var(--f-display);margin:0 0 8px;letter-spacing:.01em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:.85rem}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 .7rem/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.surplus{background:var(--risk-soft);border-color:transparent;color:var(--risk)}
.chip.shortage,.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.info{background:var(--steel-soft);border-color:transparent;color:var(--steel)}
.chip.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.stat b{display:block;font:700 1.7rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--risk-soft);margin-bottom:14px;flex-wrap:wrap}
.banner.info{background:var(--steel-soft)}
.banner.good{background:var(--good-soft)}
.banner .ico{width:28px;height:28px;flex:none}
.banner .txt{flex:1 1 280px;min-width:0}
.banner b{display:block}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.sep{height:1px;background:var(--line);margin:12px 0}
.quote{border-left:3px solid var(--accent);padding:6px 12px;background:var(--sunk);border-radius:0 6px 6px 0;font-size:.92rem}
.quote mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:2px}

/* diff & compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmp > div{background:var(--surface);padding:12px 14px}
.cmp b{font:700 1.6rem/1 var(--f-display)}
.protect{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:8px;background:var(--good-soft);color:var(--good);margin-top:10px}
.protect b{font:700 2rem/1 var(--f-display)}

/* option cards */
.opt{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.opt.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.off{background:var(--sunk);opacity:.8}
.opt .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.opt .hd h4{margin:0;font:600 1.05rem/1.2 var(--f-body);flex:1 1 220px}
.opt .code{font:600 .72rem var(--f-mono);color:var(--accent)}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font:500 .66rem/1 var(--f-mono);padding:4px 6px;border-radius:3px;background:var(--sunk);color:var(--faint);border:1px solid var(--line)}
.steps span.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.steps span.done{background:var(--good-soft);color:var(--good);border-color:transparent}

/* timeline */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.tl svg{display:block;min-width:900px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin:8px 2px 12px}
.legend i{display:inline-block;width:18px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* capture */
.rec{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;text-align:left}
.rec[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wave{width:44px;height:28px;flex:none}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);resize:vertical}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* form */
.field{display:grid;gap:4px;font-size:.85rem}
.field label{color:var(--muted);font-size:.78rem}
.field input,.field select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:.85rem}

/* demo drawer */
.drawer{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.drawer summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600}
.drawer summary::-webkit-details-marker{display:none}
.drawer ol{margin:0;padding:0 14px 12px 34px;font-size:.84rem;max-height:46vh;overflow:auto}
.drawer li{margin:6px 0;color:var(--muted)}
.drawer li.now{color:var(--fg);font-weight:600}
.drawer li.done{color:var(--faint);text-decoration:line-through}
.drawer .foot{display:flex;gap:8px;padding:0 14px 12px}
.footer{display:flex;gap:14px;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:40;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px}
  .rail .org{display:none}
  .nav{white-space:nowrap}
  main{padding:16px 16px 120px}
  .roles{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .role small{display:none}
  .cmp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .fade{animation:fade .25s ease-out} }
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}

/* v2 additions: timeline-first */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-weight:600;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.tl .bar{cursor:pointer}
.tl .bar:hover rect.hit,.tl .bar:focus rect.hit{fill:var(--accent);fill-opacity:.12}
.tl .bar:focus{outline:none}
.pop{position:fixed;z-index:50;max-height:calc(100vh - 24px);overflow:auto;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:14px}
.pop h4{margin:0;font:600 1.05rem/1.25 var(--f-body)}
.pop .x{position:absolute;top:8px;right:8px}
.pop .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pop input,.pop select{width:100%;min-width:0}
.pop .pop-actions{position:sticky;bottom:-14px;background:var(--surface);padding:10px 0 2px;margin-bottom:-2px;border-top:1px solid var(--line)}
.preview{border-radius:6px;padding:8px 10px;background:var(--sunk);font-size:.84rem;margin-top:8px}
.preview.err{background:var(--bad-soft);color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:45;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font:700 1.6rem/1 var(--f-display);margin:0 0 4px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.review{border:1px solid var(--accent);box-shadow:0 0 0 1px var(--accent);margin-bottom:12px}
.overlay-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 2px 10px}
.overlay-key i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.pulse{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.drawer ol{max-height:34vh}

/* v3: hand-offs made visible */
.trk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);min-width:0}
.trk.ok{border-color:var(--good)}
.trk.compact{border:0;padding:0;background:none}
.trk-h{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.trk-steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.trk-steps li{display:flex;gap:7px;align-items:flex-start;flex:1 1 140px;min-width:0;padding:6px 8px;border-radius:6px;background:var(--sunk);font-size:.82rem;line-height:1.3}
.trk-steps li small{color:var(--muted);font-size:.74rem}
.trk-steps li.done{background:var(--good-soft)}
.trk-steps li.done small{color:var(--good)}
.trk-steps li.wait{background:var(--steel-soft)}
.trk-steps li.wait small{color:var(--steel);font-weight:600}
.dotm{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none;border:2px solid var(--faint)}
li.done .dotm{background:var(--good);border-color:var(--good)}
li.wait .dotm{border-color:var(--steel);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{background:var(--steel)}}
.decided{border-color:var(--good)}
.demo-press{outline:3px solid var(--accent)!important;outline-offset:3px;animation:press 1s ease-in-out infinite;position:relative}
@keyframes press{50%{box-shadow:0 0 0 8px var(--accent-soft)}}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg)}
.bell .badge{position:absolute;top:-4px;right:-4px}
.notes{position:absolute;right:16px;top:58px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px;z-index:35;max-height:60vh;overflow:auto}
.note{padding:7px 0;border-top:1px solid var(--line);font-size:.86rem}
.note.unread{font-weight:600}
@media (prefers-reduced-motion:reduce){ .demo-press,li.wait .dotm{animation:none} }

.stepbtn{all:unset;cursor:pointer;display:block;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.stepbtn:hover{background:var(--sunk)}
.stepbtn:focus-visible{outline:2px solid var(--accent)}
.drawer li.done .stepbtn{text-decoration:line-through}
.drawer .hint{margin:0;padding:0 14px 12px;font-size:.76rem;color:var(--muted)}
.demo-target{outline:3px solid var(--accent)!important;outline-offset:3px;animation:press 1.2s ease-in-out infinite}
.bar.demo-target{outline:none!important;animation:none}
.bar.demo-target rect.hit{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.demo-target{animation:none}}
.drawer summary .cur{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:.86rem}
.drawer .chev{color:var(--muted);transition:transform .2s}
.drawer[open] .chev{transform:rotate(180deg)}
main{padding-bottom:160px}
.drawer[open] ol{max-height:min(60vh,520px)}
.gact{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:.72rem}
.gact summary{cursor:pointer;list-style:none;font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--steel);padding:0 6px 6px}
.gact summary::-webkit-details-marker{display:none}
.gop{padding:6px;border-radius:6px;margin:2px 0;background:var(--surface);border:1px solid var(--line)}
.gop.new{animation:gnew 2.4s ease-out}
@keyframes gnew{0%{background:var(--good-soft);border-color:var(--good)}100%{background:var(--surface)}}
.gop b{font-weight:600;font-size:.74rem}
.gop .cq{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-top:2px}
.gop .cq.open{white-space:pre-wrap;overflow:visible;word-break:break-word}
.gop .meta{display:flex;gap:6px;align-items:center;margin-top:3px;color:var(--muted);font-family:var(--f-mono);font-size:.64rem;flex-wrap:wrap}
.gsrc{padding:1px 5px;border-radius:3px;background:var(--good-soft);color:var(--good)}
.gsrc.mem{background:var(--sunk);color:var(--muted)}
[hidden]{display:none!important}
</style>
<header class="appbar">
  <div class="brand"><i aria-hidden="true"></i>SiteSync</div>
  <span class="today" title="Integer working days on a common axis">Today · Tue 29 Sep 2026 · Day 220</span>

function editValues(){
  const p = el('pop'), site = p.dataset.site, code = p.dataset.code, t = T[code], c = sched(site,'conf')[code];
  const ns = +el('f-s').value, ne = +el('f-e').value, cur = S.conf[site][code] || {};
  if (!Number.isFinite(ns) || !Number.isFinite(ne)) return {err:'Enter whole working days.'};
  if (ne < ns) return {err:'Finish can’t be before start.'};
  if (ns < c[2]) return {err:`Start can’t be before its predecessors finish (day ${c[2]}).`};
  const lag = ns - c[2], delay = (ne - ns) - t.d;
  if (delay < -t.d) return {err:'Duration can’t be negative.'};
  const ps = el('f-ps') && el('f-ps').value !== '' ? +el('f-ps').value : null, pd = el('f-pd') && el('f-pd').value !== '' ? +el('f-pd').value : 0;
  if (pd > 0){
    if (ps === null || ps < c[0] || ps > c[1]) return {err:`Blocked window must start within the step (days ${c[0]}–${c[1]}).`};
    return {site, code, lag: cur.lag || 0, delay: (cur.delay || 0) + pd, pauseStart: ps, pauseDays: pd, reason: el('f-r').value};
  }
  if (lag === (cur.lag||0) && delay === (cur.delay||0)) return {err:'No change yet. Edit the dates or add a blocked window to see the knock-on.'};

}

  S.csvRows = out.filter(r => r.st==='new' || r.st==='changed');
  return `<div class="scroll"><table><thead><tr><th>Crew</th><th>Step</th><th class="r">Window</th><th>Status</th></tr></thead><tbody>${out.map(r=>`<tr><td>${r.crew}</td><td class="mono">A-${r.step}</td><td class="r mono">${r.s}–${r.e}</td><td><span class="chip ${r.st==='new'?'info':r.st==='changed'?'hot':r.st==='unchanged'?'':'bad'}">${r.st}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:10px"><span class="muted" style="font-size:.82rem">${S.csvRows.length} booking change${S.csvRows.length===1?'':'s'} to propose.</span><span class="sp"></span><button class="btn primary" data-act="csvApply" ${S.csvRows.length?'':'disabled'}>Propose booking changes</button></div>`;
}

/* ---------------- actions (all go to the server) ---------------- */
async function proposeFromText(text, via){
  PLAUD.busy = true; openUpdate(S.tab);
  try {
    const r = via === 'plaud' ? await api('/api/ingest/plaud', {body:{site_id:'A', file_id: PLAUD.sel}}) : await api('/api/ingest/text', {body:{site_id:'A', text}});
    PLAUD.busy = false; closeModal(); S.view = 'timeline'; S.mode = {dan:'steps', priya:'steps', marcus:'steps', sam:'steps'}; await refresh();
    const p = arr(r.proposals)[0];
    toast(p ? `Update proposed from the ${via==='plaud'?'Plaud note':'transcript'}: ${p.changes[0].step_id} +${p.changes[0].to - (p.changes[0].from||0)} days.` : (r.message || 'No schedule change found in this note.'));
  } catch(e){ PLAUD.busy = false; openUpdate(S.tab); toast(`Couldn’t read the note: ${e.message}`); }
}
function poolTerms(){
  const trades = []; if (el('pt-mep') && el('pt-mep').checked) trades.push('mep'); if (el('pt-dry') && el('pt-dry').checked) trades.push('drylining');
  return {trades, recharge: el('pt-rc') ? el('pt-rc').value : "Sub's agreed day rate", return_guarantee: el('pt-rg') ? el('pt-rg').value : 'S1 back by day 235',
          priority_rule: el('pt-pr') ? el('pt-pr').value : 'Critical path wins', notice_days: el('pt-nd') ? +el('pt-nd').value : 5};
}
const ACT = {
  closePop, closeModal: () => closeModal(),
  async showRipple(){ if (G.open.ripple && G.ripple){ G.open.ripple = false; return render(); }
    const P = S.pending; const site = P ? P.site : 'A', code = P ? P.code : 'J1';
    try { G.ripple = await api(`/api/graph/ripple?site_id=${site}&step_code=${code}`); G.open.ripple = true; render(); } catch(e){ toast(`Couldn’t trace the ripple: ${e.message}`); } },
  async showSwap(){ if (G.open.swap && G.swap){ G.open.swap = false; return render(); }
    const sg = S.srv.board && S.srv.board.gaps && S.srv.board.gaps[0]; if (!sg) return toast('No open gap.');
    try { G.swap = await api(`/api/graph/swap-explain?gap_id=${encodeURIComponent(sg.id)}`); G.open.swap = true; render(); } catch(e){ toast(`Couldn’t explain the match: ${e.message}`); } },
  markRead(){ act(() => api('/api/notifications/read', {method:'POST', body:{}})); },
  noImpact(){ act(() => api('/api/signals/clear', {body:{site_id:'A', step_code:'J1'}}), 'Risk flag cleared.'); },
  openUpdate(){ openUpdate(); },
  syncPlaud(){ PLAUD.list = null; openUpdate('plaud'); },
  overlayOffer(){ S.overlay.marcus = 'A'; setMode('trades'); saveUI(); render(); },
  openStep(b){ openStep(b.dataset.site, b.dataset.code, null, true); },
  editStep(){ const p = el('pop'); openStep(p.dataset.site, p.dataset.code, null, true); },
  pickRec(b){ pickRecording(b.dataset.id); },
  async submitEdit(){ const v = editValues(); if (v.err) return toast(v.err); closePop();
    try { await api('/api/proposals', {body: v.pauseDays ? {site_id:v.site, step_id:`${v.site}-${v.code}`, pause_start:v.pauseStart, pause_days:v.pauseDays, reason:v.reason}
                                                    : {site_id:v.site, step_id:`${v.site}-${v.code}`, start:v.start, finish:v.finish, reason:v.reason}}); }
    catch(e){ if (e.status === 404 || e.status === 405) { if (v.lag) return toast('Start-date moves need the timeline-edit endpoint, which isn’t on the server yet.');
        await tryApi('/api/ingest/text', {body:{site_id:v.site, text:`${T[v.code].n} delayed ${v.delay - ((S.conf[v.site][v.code]||{}).delay||0)} working days, ${v.reason.toLowerCase()}.`}}); }
      else { await refresh(); return toast(`Couldn’t propose: ${e.message}`); } }
    await refresh(); toast(S.user==='dan' ? 'Update proposed. Check the knock-on, then confirm the fact.' : 'Update proposed.'); },
  plaudPropose(){ if (PLAUD.sel && S.tab==='plaud' && !el('pasteText')?.matches(':focus')) return proposeFromText(null, 'plaud'); return proposeFromText(el('pasteText') ? el('pasteText').value : DEMO_TRANSCRIPT, 'text'); },
  pasteProposeAlt(){ return proposeFromText(el('pasteText').value, 'text'); },
  confirmPending(){ const P = S.pending; if (!P) return; closePop();
    act(() => api(`/api/proposals/${P.id}/decide`, {body:{accept:true}}), r => r && r.status==='SITE_CONFIRMED' ? 'Sent to Priya for approval. You’ll see it here when she decides.' : 'Timeline updated.'); },
  approvePending(){ const P = S.pending; if (!P) return;
    act(() => api(`/api/proposals/${P.id}/decide`, {body:{accept:true}}), () => { const g = S.srv.gap; return g ? `Approved. New gap: ${g.crew} idle days ${g.start}–${g.end}. See Sync Board.` : 'Approved. Timeline updated.'; }); },
  discardPending(){ const P = S.pending; if (!P) return; act(() => api(`/api/proposals/${P.id}/decide`, {body:{accept:false}}), 'Proposal discarded; nothing moved.'); },
  offerCapacity(){ const g = S.srv.gap; if (!g) return toast('No open gap to offer.');
    act(() => api('/api/offers', {body:{gap_id:g.id}}), 'Offered. Nearby projects that need M&E will see it, anonymised.'); },
  requestView(){ const anon = SITES.A.anonId || (S.srv.offerM && S.srv.offerM.anon_id); if (!anon) return toast('No offer visible yet.');
    act(() => api('/api/view-requests', {body:{anon_id:anon}}), `Request sent. Waiting for ${SITES.A.anon}’s company.`); },
  grantView(b){ const id = (b && b.dataset && b.dataset.id) || (S.srv.viewReq && S.srv.viewReq.id); if (!id) return;
    act(() => api(`/api/view-requests/${id}/decide`, {body:{share:true}}), 'Shared. They have been notified.'); },
  denyView(b){ const id = b && b.dataset && b.dataset.id; act(() => api(`/api/view-requests/${id}/decide`, {body:{share:false}}), 'Declined. Your project stays invisible to them.'); },
  requestLink(){ const o = S.srv.offerM; if (!o) return toast('No offer visible.');
    act(() => api('/api/links', {body:{offer_id:o.id || o.offer_id, purpose:'Borrow the offered M&E crew for first fix'}}), `Crew requested. Waiting for ${SITES.A.anon}’s company.`); },
  acceptLink(b){ const id = (b && b.dataset && b.dataset.id) || (S.srv.linkReq && S.srv.linkReq.id);
    act(() => api(`/api/links/${id}/decide`, {body:{accept:true, pool_terms: poolTerms()}}), 'Accepted. Riverside and Sparks have been notified.'); },
  declineLink(b){ const id = (b && b.dataset && b.dataset.id) || (S.srv.linkReq && S.srv.linkReq.id);
    act(() => api(`/api/links/${id}/decide`, {body:{accept:false}}), 'Declined. Riverside never learns who you are.'); },
  approveM3(){ const g = S.srv.gap; act(() => api('/api/options/approve', {body:{gap_id:g.id, mechanism:'M3'}}), 'Re-slotted. Days protected; S1 idle at the sub’s cost.'); },
  samAccept(){ const cp = S.srv.cp; act(() => api(`/api/cross-proposals/${cp.id}/decide`, {body:{accept:true}}), 'Accepted. Northgate and Riverside have been notified.'); },
  declineCross(){ const cp = S.srv.cp; if (S.user==='sam' && cp) return act(() => api(`/api/cross-proposals/${cp.id}/decide`, {body:{accept:false}}), 'Declined.');
    const p = S.srv.bookC; if (p) act(() => api(`/api/proposals/${p.id}/decide`, {body:{accept:false}}), 'Declined.'); },
  marcusConfirm(){ const p = S.srv.bookC; act(() => api(`/api/proposals/${p.id}/decide`, {body:{accept:true}}), 'Confirmed. Northgate has been notified.'); },
  async confirmBooking(){ const p = S.srv.bookA; await act(() => api(`/api/proposals/${p.id}/decide`, {body:{accept:true}}));
    await go('priya','report'); toast('Sync done. 3 days protected, £24,000.'); },
  csvSample(){ el('csvOut').innerHTML = csvDiff(`crew,step,start,end,size\nRoofing crew,A-J1,220,230,4\nGlazing crew,A-J3,220,230,4\nCladding crew,A-J4,206,231,5`); },
  csvApply(){ closeModal(); toast('CSV preview only in this build: booking import isn’t wired to the server yet.'); }
};

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const bar = e.target.closest('.bar'); if (bar) { openStep(bar.dataset.site, bar.dataset.code, {x:e.clientX, y:e.clientY}, false); return; }
  const b = e.target.closest('button,[data-view-go]');
  if (!e.target.closest('#notes') && !e.target.closest('#bell')) el('notes').hidden = true;
  if (!b) { if (!e.target.closest('#pop')) closePop(); if (e.target.id==='modal') closeModal(); return; }
  if (b.dataset.user) return go(b.dataset.user);
  if (b.dataset.view) { S.view = b.dataset.view; closePop(); saveUI(); return refresh(); }
  if (b.dataset.viewGo) { S.view = b.dataset.viewGo; saveUI(); return refresh(); }
  if (b.dataset.sitePick) { S.site[S.user] = b.dataset.sitePick; if (S.overlay[S.user]===b.dataset.sitePick) S.overlay[S.user] = null; return render(); }
  if (b.dataset.mode) { setMode(b.dataset.mode); return render(); }
  if (b.dataset.step !== undefined) return jumpTo(+b.dataset.step);
  if (b.dataset.overlay !== undefined) { S.overlay[S.user] = b.dataset.overlay || null; if (b.dataset.overlay) setMode('trades');
    return render(); }
  if (b.dataset.utab) return openUpdate(b.dataset.utab);
  if (b.dataset.act && ACT[b.dataset.act]) ACT[b.dataset.act](b);
});
document.addEventListener('click', e => { const q = e.target.closest('.cq'); if (q) q.classList.toggle('open'); });
document.addEventListener('toggle', e => { if (e.target.id === 'gact') { GACT_OPEN = e.target.open; try { localStorage.setItem('sitesync-gact', GACT_OPEN ? '1' : '0'); } catch(_) {} } }, true);
function setGuide(on){ GUIDE = on; try { localStorage.setItem('sitesync-guide', on ? '1' : '0'); } catch(e) {} el('drawer').hidden = !on; el('guideBtn').setAttribute('aria-pressed', on); render(); }
el('guideBtn').addEventListener('click', () => setGuide(!GUIDE));
el('resetTop').addEventListener('click', () => el('reset').click());
el('drawer').hidden = !GUIDE; el('guideBtn').setAttribute('aria-pressed', GUIDE);
document.addEventListener('keydown', e => {
  if (e.key==='g' && !e.metaKey && !e.ctrlKey && !['INPUT','TEXTAREA','SELECT'].includes((e.target.tagName||''))) setGuide(!GUIDE);
  if (e.key==='Escape'){ closePop(); closeModal(); }
  const bar = e.target.closest && e.target.closest('.bar');
  if (bar && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); const r = bar.getBoundingClientRect(); openStep(bar.dataset.site, bar.dataset.code, {x:r.left+20, y:r.bottom}, false); }
});
document.addEventListener('input', e => { if (['f-s','f-e','f-r','f-ps','f-pd'].includes(e.target.id)) previewEdit(); });
document.addEventListener('change', e => {
  if (e.target.id==='csvfile' && e.target.files[0]){ const r = new FileReader(); r.onload = () => { el('csvOut').innerHTML = csvDiff(String(r.result)); }; r.readAsText(e.target.files[0]); }
  if (e.target.id==='photofile' && e.target.files[0]) toast('Photo received. Vision parsing is a should-have and not in this demo build.');
});
el('bell').addEventListener('click', async e => { e.stopPropagation(); const n = el('notes'); if (!n.hidden) { n.hidden = true; return; }
  const mine = S.notes;
  n.innerHTML = `<div class="row" style="margin-bottom:6px"><b>Notifications</b><span class="sp"></span><span class="muted" style="font-size:.78rem">${U().full}</span></div>` + (mine.length ? mine.map(x => `<div class="note ${x.read?'':'unread'}"><span class="mono muted">${x.t}</span> ${x.text}</div>`).join('') : '<div class="muted" style="font-size:.86rem">Nothing yet.</div>');
  n.hidden = false; await tryApi('/api/notifications/read', {method:'POST', body:{}}); S.notes.forEach(x => x.read = true); renderBell(); });
el('showMe').addEventListener('click', () => { const p = progress(); if (p < SCRIPT.length){ el('drawer').open = false; applyGuide.last = null; go(SCRIPT[p][0], SCRIPT[p][1]); toast(SCRIPT[p][2]); } });
el('reset').addEventListener('click', async () => { await tryApi('/api/demo/reset', {method:'POST', body:{}}); PLAUD.list = null; PLAUD.sel = null; S = fresh(); S.user = 'dan'; S.view = 'timeline'; S.overlay = {priya:null, marcus:null}; S.mode = {dan:'steps', priya:'steps', marcus:'steps', sam:'steps'}; closePop(); closeModal(); await refresh(); toast('Demo reset to the seed state.'); });
// extra data for specific views, loaded on each refresh
const _sync = sync;
sync = async function(){
  await _sync();
  const extra = await Promise.all([
    S.user === 'sam' ? tryApi('/api/sub/bookings', {}, 'sam') : null,
    S.view === 'city' ? tryApi('/api/city') : null,
    S.view === 'links' ? tryApi('/api/links') : null,
    null]);
  const sb = extra[0] ? arr(extra[0].bookings || extra[0]) : null;
  S.srv.subBookings = sb && sb.length ? sb.map(b => ({crew: b.crew, client: (b.org_name || '').split(' ')[0], site: b.site_name, step: b.step_name || b.step_code,
      s: (b.booking||[])[0], e: (b.booking||[])[1], ss: (b.step_active||[])[0], se: (b.step_active||[])[1]})) : null;
  S.srv.city = extra[1] ? arr(extra[1]) : S.srv.city;
  S.srv.links = extra[2] ? arr(extra[2]) : S.srv.links;
  if (extra[3]) S.srv.overlay = extra[3];
};
refresh();

</script>
</body></html>
